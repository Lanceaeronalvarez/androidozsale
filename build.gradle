// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
        jcenter()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.0'
        classpath 'me.tatarka:gradle-retrolambda:3.2.5'
        classpath 'com.google.gms:google-services:4.4.2'
        classpath 'io.codearte.gradle.nexus:gradle-nexus-staging-plugin:0.5.3'
        classpath "com.newrelic.agent.android:agent-gradle-plugin:7.5.0"
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.2'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        jcenter()
        maven { url 'https://jitpack.io' }
        maven { url 'https://maven.google.com' }
        maven { url 'https://x.klarnacdn.net/mobile-sdk/' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Define versions in a single place
ext {
    // Sdk and tools
    minSdkVersion = 21
    targetSdkVersion = 34
    compileSdkVersion = 34
    buildToolsVersion = '33.0.2'

    // App dependencies
    supportLibrary = '28.0.0'
    gsonVersion = '2.11.0'
    calligraphyVersion = '3.1.1'
    viewPumpVersion = '2.0.3'

    // Network
    rx2FastAndroidNetworking = '1.0.2'
    cookieJarVersion = 'v1.0.1'

    dagger2Version = '2.51.1'
    rxjava2Version = '2.2.21'
    rxandroidVersion = '2.1.1'
    butterKnifeVersion = '10.2.3'
    greenDaoVersion = '3.2.2'
    placeholderviewVersion = '0.6.1'
    debugDBVersion = '1.0.0'
    timberVersion = '4.5.1'
    guavaVersion = '28.2-android'
    numberPickerVersion = '2.4.4'

    //Test dependencies
    junitVersion = '4.13.2'
    espressoVersion = '2.2.2'
    mockitoVersion = '5.12.0'

    //Routing
    conductorVersion = '3.2.0'
    paginateVersion = '0.5.1'

    //Image Loading
    glideVersion = '4.3.1'
    photoViewVersion = '2.0.0'

    braintreeVersion = '4.38.0'
    facebookVersion = '17.0.0'

    gcmVersion = '17.0.0'
    crystalRangeSeekbarVersion = '1.1.3'
    stickyHeadersVersion = '0.4.3@aar'

    //transactiontoolarge logger
    tooLargeToolVersion = '0.3.0'
}
