                            javaexec {
                                classpath = files(project.projectDir.absolutePath + "/build/intermediates/javac/"+buildVariant+"/classes/")
                                main = "au.com.dealsdirect.ui.controller.main.Settings"
                                args countryName, flavorName, "PRINT_CURRENCY_CODE"
                            }
                        }

                }

            }
    }
}

