apply plugin: 'com.android.application'
apply plugin: 'io.fabric'
apply plugin: 'newrelic'

android {
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    lintOptions {
        disable 'MissingTranslation'
    }

    defaultConfig {
        applicationId "au.com.dealsdirect.rc"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        multiDexEnabled true
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        releaseConfig {
            storeFile file('ozsale.keystore')
            storePassword('ozsale')
            keyAlias "ozsale"
            keyPassword "ozsale"
        }
    }

    buildTypes {

        // Always use release variant for deployment to QA and app release
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.releaseConfig
            zipAlignEnabled true

            resValue "bool", "debug_mode", "false"
            aaptOptions.cruncherEnabled = true
            ext.alwaysUpdateBulidId = true
        }

        // Always use debug variant during development
        debug {
            resValue "bool", "debug_mode", "true"
            aaptOptions.cruncherEnabled = false
            ext.alwaysUpdateBulidId = false
        }
    }

    flavorDimensions "default"

