                android.productFlavors.configureEach {
                    flavor ->
                        if (flavorName.matches(flavor.name) && buildTypeAssemble.matches(variant.name.capitalize())) {
                            def buildVariant = flavorName + variant.buildType.name.capitalize()
                            def compileWithJavac = "compile" + buildVariant.capitalize() + "JavaWithJavac"
                            def path = project.projectDir.absolutePath + "/build/intermediates/javac/" + buildVariant + "/" + compileWithJavac + "/classes/"
                            def injected = project.objects.newInstance(InjectedExecOps)
                            injected.execOps.javaexec {
                                classpath = files(path)
                                mainClass = "au.com.dealsdirect.data.network.ApiEndPoint"
                            }
                        }

                }

            }

    }
}

