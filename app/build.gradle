repositories {
    flatDir { dirs 'libs' }
}

dependencies {
    compile fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'com.android.databinding:library:1.3.3'
    implementation 'com.android.databinding:adapters:1.3.3'

    // android support libraries
    compile "com.android.support:appcompat-v7:$rootProject.supportLibrary"
    compile "com.android.support:recyclerview-v7:$rootProject.supportLibrary"
    compile "com.android.support:cardview-v7:$rootProject.supportLibrary"
    compile "com.android.support:design:$rootProject.supportLibrary"
    compile "com.android.support:support-vector-drawable:$rootProject.supportLibrary"
    compile "com.android.support:animated-vector-drawable:$rootProject.supportLibrary"

    implementation 'com.android.support.constraint:constraint-layout:1.1.2'

    // font
    compile "uk.co.chrisjenx:calligraphy:$rootProject.calligraphyVersion"

    // network
    compile "com.amitshekhar.android:rx2-android-networking:$rootProject.rx2FastAndroidNetworking"

    // parser
    compile "com.google.code.gson:gson:$rootProject.gsonVersion"

    // database
    compile "org.greenrobot:greendao:$rootProject.greenDaoVersion"

    //cookie jar
    compile "com.github.franmontiel:PersistentCookieJar:$rootProject.cookieJarVersion"

    // debug database
    debugCompile "com.amitshekhar.android:debug-db:$rootProject.debugDBVersion"

    // dependency injection
    compile "com.google.dagger:dagger:$rootProject.dagger2Version"
    annotationProcessor "com.google.dagger:dagger-compiler:$rootProject.dagger2Version"
    provided 'javax.annotation:jsr250-api:1.0'
    compile 'javax.inject:javax.inject:1'

    // reactive
    compile "io.reactivex.rxjava2:rxjava:$rootProject.rxjava2Version"
    compile "io.reactivex.rxjava2:rxandroid:$rootProject.rxandroidVersion"

    // code generator for view
    compile "com.jakewharton:butterknife:$rootProject.butterKnifeVersion"
    annotationProcessor "com.jakewharton:butterknife-compiler:$rootProject.butterKnifeVersion"

    // swipe view
    compile "com.mindorks:placeholderview:$rootProject.placeholderviewVersion"

    // logger
    compile "com.jakewharton.timber:timber:$rootProject.timberVersion"

    // conductor
    compile "com.bluelinelabs:conductor:$rootProject.conductorVersion"
    compile "com.bluelinelabs:conductor-support:$rootProject.conductorVersion"

    // paginate
    compile "com.github.markomilos:paginate:$rootProject.paginateVersion"

    // leak canary
    debugImplementation "com.squareup.leakcanary:leakcanary-android:$rootProject.leakCanaryVersion"
    releaseImplementation "com.squareup.leakcanary:leakcanary-android-no-op:$rootProject.leakCanaryVersion"

    // recycler view pager
    compile "com.github.lsjwzh.RecyclerViewPager:lib:$rootProject.recyclerViewPagerVersion"
    // advanced recyclerview
    implementation ('com.h6ah4i.android.widget.advrecyclerview:advrecyclerview:0.11.0@aar')
    // flow layout
    compile "com.zhy:flowlayout-lib:$rootProject.flowLayoutVersion"
    // photo view
    compile "com.github.chrisbanes:PhotoView:$rootProject.photoViewVersion"
    // bottom navigation
    compile 'com.aurelhubert:ahbottomnavigation:2.1.0'
    // circle indicator
    compile 'me.relex:circleindicator:1.2.2@aar'

    // glide
    compile "com.github.bumptech.glide:glide:$rootProject.glideVersion"

    // picker
    compile "com.shawnlin:number-picker:$rootProject.numberPickerVersion"

    // guava
    compile "com.google.guava:guava:$rootProject.guavaVersion"

    // braintree
    compile "com.braintreepayments.api:braintree:$rootProject.braintreeVersion"
    compile "com.braintreepayments.api:data-collector:$rootProject.braintreeVersion"

    // facebook
    compile "com.facebook.android:facebook-android-sdk:$rootProject.facebookVersion"
    implementation "com.facebook.android:facebook-login:$rootProject.facebookVersion"

    // GCM
    compile "com.google.android.gms:play-services-gcm:$rootProject.gcmVersion"

    // Crystal Range Seekbar
    compile "com.crystal:crystalrangeseekbar:$rootProject.crystalRangeSeekbarVersion"

    //viewpager indicator
    compile 'me.relex:circleindicator:1.2.2@aar'

    // sticky headers
    compile "com.timehop.stickyheadersrecyclerview:library:$rootProject.stickyHeadersVersion"

    // dependencies for local unit tests
    testCompile "junit:junit:$rootProject.ext.junitVersion"
    testCompile "org.mockito:mockito-core:$rootProject.mockitoVersion"
    testAnnotationProcessor "com.google.dagger:dagger-compiler:$rootProject.dagger2Version"
    testCompile 'org.json:json:20160810'

    // UI Testing
    androidTestCompile "com.android.support.test.espresso:espresso-core:$rootProject.espressoVersion"
    androidTestCompile "com.android.support.test.espresso:espresso-intents:$rootProject.espressoVersion"
    androidTestCompile "org.mockito:mockito-core:$rootProject.mockitoVersion"
    androidTestAnnotationProcessor "com.google.dagger:dagger-compiler:$rootProject.dagger2Version"

    // Answers
    compile('com.crashlytics.sdk.android:answers:1.4.2@aar') {
        transitive = true
    }

    // NR
    compile 'com.newrelic.agent.android:android-agent:5.22.0'

    // Firebase
    implementation 'com.google.firebase:firebase-core:16.0.8'
    implementation 'com.crashlytics.sdk.android:crashlytics:2.9.9'
    implementation 'com.google.firebase:firebase-messaging:17.4.0'

    compile 'com.loopj.android:android-async-http:1.4.9'

    //VISA CHECKOUT
    // Visa checkout
    compile 'com.braintreepayments.api:visa-checkout:1.0.0'
    compile(name: 'visacheckout-android-sdk-5.5.2', ext: 'aar')
    compile 'com.squareup.okio:okio:1.13.0'
    compile 'com.squareup.okhttp3:okhttp:3.9.1'
    compile group: 'de.greenrobot', name: 'eventbus', version: '2.4.1'

    implementation 'com.google.android.gms:play-services-ads:17.2.1'
    compile "com.android.support:multidex:1.0.0"

    // reCAPTCHA
    compile 'com.google.android.gms:play-services-safetynet:16.0.0'

    compile project(path: ':genie-utility')
    compile project(path: ':genie-animation')
    compile project(path: ':genie-views')
    compile project(path: ':genie-profiler')
    compile project(path: ':CardForm')
    compile project(path: ':ptr-lib')


}

// Create New Relic properties file according to flavor
File newRelicProperties = new File("${project.projectDir.absolutePath}/newrelic.properties")
newRelicProperties.createNewFile()

android.applicationVariants.all { variant ->
    variant.productFlavors.each { flavor ->
        def variantSuffix = variant.name.capitalize()
        def generateResourcesTask = project.tasks.getByName("compile${variantSuffix}Sources")
        def generatePropertiesTask = task("newRelicGenerateProperties${variantSuffix}") << {
            Properties properties = new Properties()
            properties.load(newRelicProperties.newDataInputStream())
            properties.setProperty("com.newrelic.application_token", flavor.ext.newRelicAppToken)
            properties.store(newRelicProperties.newWriter(), null)
        }
        generateResourcesTask.dependsOn generatePropertiesTask
    }
}

configurations.all {
    resolutionStrategy.force "com.android.support:support-annotations:$supportLibrary"
}

apply plugin: 'com.google.gms.google-services'
